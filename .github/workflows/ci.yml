name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verification battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (package)
        run: npm run typecheck

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: Unit / regression tests
        run: npm test

      - name: End-to-end court simulation
        run: npm run simulate:court
